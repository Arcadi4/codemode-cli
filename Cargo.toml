[package]
name = "codemode-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A stateless MCP host for shell-native agent workflows"
license = "MIT"

[[bin]]
name = "cm"
path = "src/main.rs"

[dependencies]
aes = "0.9.2"
cbc = "0.2.1"
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
json5 = "1"
jsonschema = { version = "0.60", default-features = false }
mime_guess = "2"
pbkdf2 = "0.13.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-async-rw"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11"
sse-stream = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
